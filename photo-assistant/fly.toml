# Fly.io deployment: `fly launch --copy-config --no-deploy` then `fly volumes create data --size 3` and `fly deploy`.
app = "smori-photo-assistant"
primary_region = "lax"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/app/data"
  NODE_ENV = "production"
  SHOPIFY_APP_URL = "https://smori-photo-assistant.fly.dev"
  SHOPIFY_SHOP = "smori-9216.myshopify.com"
  SHOPIFY_API_VERSION = "2026-07"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
